<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Precipice</title>
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0c0828">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Spinner shown while the game's files are still loading. */
    #boot {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      border: 4px solid #342468;
      border-top-color: #a4e4fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
  </style>
</head>
<body>
  <div id="boot"></div>
  <canvas id="screen" width="480" height="270"></canvas>
  <script>
    // Show errors on screen instead of a silent black window.
    window.onerror = function (msg, src, line) {
      var d = document.getElementById('err') || document.body.appendChild(document.createElement('pre'));
      d.id = 'err';
      d.style.cssText = 'position:fixed;left:8px;top:8px;right:8px;color:#fc9838;font:14px monospace;white-space:pre-wrap;z-index:9';
      d.textContent += 'Error: ' + msg + ' (' + (src || '').split('/').pop() + ':' + line + ')\n';
    };
  </script>
  <script src="js/config.js"></script>
  <script src="js/font.js"></script>
  <script src="js/gfx.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
  <script src="js/touch.js"></script>
  <script>
    // Installable / offline web app (skipped in the desktop and Android apps).
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.Capacitor) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
