# Builds the game's apps on every push to main and publishes them as the
# latest GitHub Release, named after GAME_VERSION in js/config.js (the tag stays
# build-N, which the Windows app's updater uses):
#   Precipice.exe          - Windows, one portable file (everything packed inside)
#   Precipice-Android.apk  - Android
# Download links used by the game's title screen:
#   https://github.com/coldzeeyt/precipice/releases/latest/download/Precipice.exe
#   https://github.com/coldzeeyt/precipice/releases/latest/download/Precipice-Android.apk
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Stamp the version + build number into the app (e.g. 1.8.24) so Precipice.exe can tell
      # when a newer release (build-N) is out and update itself.
      - name: Set version
        shell: bash
        run: |
          V=$(node -e "console.log(/GAME_VERSION = '([^']+)'/.exec(require('fs').readFileSync('js/config.js','utf8'))[1])")
          npm version "$V.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Build portable Precipice.exe
        run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Precipice.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p mobile/www
          cp -r index.html manifest.webmanifest icon.png icons js assets mobile/www/

      - name: Create Android project (Capacitor)
        working-directory: mobile
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Precipice com.coldzeeyt.precipice --web-dir www
          npx cap add android

      - name: Landscape + app icon
        working-directory: mobile/android/app/src/main
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' AndroidManifest.xml
          rm -rf res/mipmap-anydpi-v26
          for d in res/mipmap-*; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp "$GITHUB_WORKSPACE/icons/icon-192.png" "$d/$f.png"
            done
          done

      - name: Build APK
        working-directory: mobile
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Precipice-Android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Precipice-Android.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the game version
        id: ver
        run: echo "v=$(node -e "console.log(/GAME_VERSION = '([^']+)'/.exec(require('fs').readFileSync('js/config.js','utf8'))[1])")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Precipice ${{ steps.ver.outputs.v }}
          body: |
            **Windows:** download `Precipice.exe` and run it. Everything is packed inside.
            **Android:** download `Precipice-Android.apk` and open it to install.
          files: |
            out/Precipice.exe
            out/Precipice-Android.apk
          make_latest: true
